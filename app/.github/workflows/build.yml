name: Build

on:
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: Run the packaged app against a live zrok tunnel on Windows
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            artifact: linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - run: npm ci

      - run: npm run prepare:runtime
        env:
          SECRET_TUNNEL_REQUIRE_CLEAN_MCP_SOURCE: "1"

      - run: npm run smoke:binaries

      - run: npm run smoke:layout

      - run: npm run smoke:ui

      - run: npm run smoke:mcp

      - run: npm run build

      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check
          cargo test

      - run: npm run clean:release-bundle

      - run: npm run tauri build

      - run: npm run smoke:release-binaries

      - run: npm run smoke:release-runtime

      - run: npm run smoke:release-launch:windows
        if: runner.os == 'Windows'

      - name: Live zrok E2E
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' && inputs.run_live_e2e }}
        shell: pwsh
        env:
          SECRET_TUNNEL_ZROK_ENABLE_TOKEN: ${{ secrets.SECRET_TUNNEL_ZROK_ENABLE_TOKEN }}
        run: |
          if (-not $env:SECRET_TUNNEL_ZROK_ENABLE_TOKEN) {
            throw "SECRET_TUNNEL_ZROK_ENABLE_TOKEN secret is required for live E2E."
          }
          npm run smoke:live

      - run: npm run release:checksums

      - uses: actions/upload-artifact@v4
        with:
          name: chatgpt-mcp-launcher-${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
