name: Build

# GitHub only reads workflows from `.github/workflows` at the repository root.
# This file previously lived under `app/`, where it never ran, which is why the
# repo had no build evidence at all. Every step therefore runs from `app/`.

on:
  workflow_dispatch:
    inputs:
      run_live_e2e:
        description: Run the packaged app against a live zrok tunnel on Windows
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: npm ci

      # Downloads the pinned zrok build for this platform and clones the
      # bundled MCP source. A dirty local MCP checkout is rejected here, so a
      # release can never contain uncommitted server code.
      - run: npm run prepare:runtime
        env:
          SECRET_TUNNEL_REQUIRE_CLEAN_MCP_SOURCE: "1"

      - run: npm run smoke:binaries
      - run: npm run smoke:layout
      - run: npm run smoke:ui
      - run: npm run smoke:mcp

      - run: npm run build

      - name: Rust checks
        working-directory: app/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked

      - run: npm run clean:release-bundle

      - run: npm run tauri build

      - run: npm run smoke:release-binaries
      - run: npm run smoke:release-runtime

      - run: npm run smoke:release-launch:windows
        if: runner.os == 'Windows'

      - name: Live zrok E2E
        if: ${{ github.event_name == 'workflow_dispatch' && matrix.os == 'windows-latest' && inputs.run_live_e2e }}
        shell: pwsh
        working-directory: app
        env:
          SECRET_TUNNEL_ZROK_ENABLE_TOKEN: ${{ secrets.SECRET_TUNNEL_ZROK_ENABLE_TOKEN }}
        run: |
          if (-not $env:SECRET_TUNNEL_ZROK_ENABLE_TOKEN) {
            throw "SECRET_TUNNEL_ZROK_ENABLE_TOKEN secret is required for live E2E."
          }
          npm run smoke:live

      - run: npm run release:checksums

      - uses: actions/upload-artifact@v4
        with:
          name: secret-tunnel-${{ matrix.artifact }}
          path: app/src-tauri/target/release/bundle/**/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Only the installer formats are published; the loose `bundle/` tree also
      # contains the unpacked app directories, which are not useful downloads.
      #
      # Assets are renamed to stable, version-free names so the download page can
      # link to /releases/latest/download/<name> and keep working across releases.
      # Tauri's own names carry the version and a space, which would break those
      # links on every bump.
      - name: Collect installers
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/secret-tunnel-*; do
            [ -d "$dir" ] || continue
            slug="$(basename "$dir")"
            slug="${slug#secret-tunnel-}"
            find "$dir" -type f \( -name '*-setup.exe' -o -name '*.msi' -o -name '*.dmg' \) |
              while IFS= read -r file; do
                case "$file" in
                  *-setup.exe) cp "$file" "release/SecretTunnel-${slug}-setup.exe" ;;
                  *.msi)       cp "$file" "release/SecretTunnel-${slug}.msi" ;;
                  *.dmg)       cp "$file" "release/SecretTunnel-${slug}.dmg" ;;
                esac
              done
          done
          ls -l release
          test -n "$(ls -A release)" || { echo "no installers were produced"; exit 1; }
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --generate-notes --verify-tag
